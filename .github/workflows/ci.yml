name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Build
        run: go build -o mapip.exe ./cmd/mapip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapip-windows
          path: mapip.exe

  desktop:
    name: Build desktop (renderer + main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Typecheck + build
        working-directory: desktop
        run: npm run build
